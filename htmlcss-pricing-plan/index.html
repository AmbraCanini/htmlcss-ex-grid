<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <!--Titolo a sinistra-->
    <header>
        <div class="Titolo-Paragrafo">
            <h1>Our Pricing Plan</h1>
            <p>L'abbonamento migliore è sempre quello a sinistra</p>
        </div>
    </header>

    <!--Card centrali-->
    <main>
        <div class="card">
            <div>
                <h3> Basic </h3>
                <p> Most Popular</p>
            </div>
            <div class="price">
                <h3 class="price-1"> 15 €/mese </h3>
                <div class="confronto">
                    Annuale 15% di sconto
                </div>
                <button class="apply1">Iscriviti ora</button>
                <ul class="first-icon">
                    <li class="li1">
                        <i class="bi bi-check"></i>
                        <span>Unlimited production</span>
                    </li>
                    <li class="li2">
                        <i class="bi bi-check"></i>
                        <span>10GB storage</span>
                    </li>
                    <li class="li3">
                        <i class="bi bi-x-lg"></i>
                        <span>Email support</span>
                    </li>
                </ul>
            </div>

        </div>

    </main>

</body>

</html>
