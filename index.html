<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Grid</title>
</head>

<body>

    <!--profile è lo sfondo modificato come se fosse mobile -->
    <div class="profile">
        <!--header sopra con freccia nome e menù -->
        <header>
            <span class="back">‹</span>
            <h1>your pappagallo</h1>
            <span class="menu">•••</span>
        </header>

        <main>

            <img class="profile-picture" src="img/logo.jpg" alt="Profile picture">

            <h2>@pappagallo</h2>
            <!--riga con numeriseguiti da following followers likes -->
            <div class="stats">
                <div>
                    <strong>525</strong>
                    <span>Following</span>
                </div>

                <div>
                    <strong>24.9K</strong>
                    <span>Followers</span>
                </div>

                <div>
                    <strong>1.3M</strong>
                    <span>Likes</span>
                </div>
            </div>

            <div class="actions">
                <button class="follow">Follow</button>
                <button>◎</button>
                <button>▼</button>
            </div>

            <div class="bio">
                <p>your tech partner 💻</p>
                <p>lifelong career companion</p>
                <p>⬇️ Discover our masters ⬇️</p>
                <p>https://boolean.careers</p>
            </div>

            <div class="tabs">
                <span>▦</span>
                <span>♡</span>
            </div>

            <div class="gallery">
                <div class="square1">
                    <img src="img/pappagallo-1.jpg" alt="">
                </div>

                <div class="square2">
                    <img src="img/pappagallo-2.jpg" alt="">
                </div>

                <div class="square3">
                    <img src="img/pappagallo-3.jpg" alt="">
                </div>

                <div class="square4">
                    <img src="img/pappagallo-4.jpg" alt="">
                </div>

                <div class="square5">
                    <img src="img/pappagallo-5.jpg" alt="">
                </div>

                <div class="square6">
                    <img src="img/pappagallo-6.jpg" alt="">
                </div>

                <div class="square9">
                    <img src="img/pappagallo-3.jpg" alt="">
                </div>

                <div class="square8">
                    <img src="img/pappagallo-2.jpg" alt="">
                </div>

                <div class="square7">
                    <img src="img/pappagallo-1.jpg" alt="">
                </div>



            </div>

        </main>

    </div>

</body>

</html>
